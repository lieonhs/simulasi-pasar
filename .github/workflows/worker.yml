# Deploy Cloudflare Worker RAM Capital setiap kali kode server berubah.
# Butuh repository secrets (GitHub → Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Secrets aplikasi (TOKEN_SECRET, APP_USERS, GEMINI_API_KEY, INDODAX_*, BINANCE_FUT_*) diisi di dashboard Cloudflare, tidak di sini.
name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths: ["worker/**", "supabase/functions/**", "tools/gen-worker.py", "wrangler.toml", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Buat kode Worker dari fungsi Supabase
        run: python3 tools/gen-worker.py
      - name: Lewati (token Cloudflare belum diisi)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN belum ada di GitHub Secrets — deploy dilewati."
      - name: Deploy ke Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
